[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "manufacturing-process-intelligence"
version = "0.0.1"
description = "Manufacturing process and predictive quality intelligence."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "h5py>=3.16,<4",
  "lightgbm>=4.6,<5",
  "numpy>=2.3,<3",
  "polars>=1.34,<2",
  "plotly>=6.3,<7",
  "pydantic>=2.11,<3",
  "scikit-learn>=1.7,<2",
  "streamlit>=1.49,<2",
  "typer>=0.16,<1",
]

[project.scripts]
mpi = "mpi.cli.app:app"

[dependency-groups]
dev = [
  "ipykernel>=6.30,<7",
  "matplotlib>=3.10,<4",
  "nbconvert>=7.16,<8",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.400,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mpi"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
